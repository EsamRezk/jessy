<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta property="og:title" content="جيسي، عندك دعوة 💌">
<meta property="og:description" content="افتحي وشوفي 👀">
<meta name="theme-color" content="#1b1530">
<style>[hidden]{display:none!important} *{box-sizing:border-box} button{-webkit-appearance:none}</style>
<title>عزومة جيسي</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Baloo+Bhaijaan+2:wght@500;700&family=Lalezar&display=swap">
<style>
  /* Layout: one night-sky screen; a lone runaway "No", then a bear carries "Yes" to center; ends on a cream dinner ticket. */
  :root {
    --night: #1b1530;
    --night-2: #2b2048;
    --glow: #52304f;
    --candle: #ffc65c;
    --candle-deep: #c9891f;
    --rose: #ff7a98;
    --rose-deep: #d9496b;
    --cream: #fff4e4;
    --muted: #c7b8da;
    --paper: #fff3e2;
    --ink: #2b1d3a;
    --ink-soft: #6d5a7c;
    --bear: #a5683d;
    --bear-light: #ecc89c;
    --bear-dark: #3b2417;

    --display: "Lalezar", "Baloo Bhaijaan 2", Tahoma, sans-serif;
    --body: "Baloo Bhaijaan 2", "Segoe UI", Tahoma, sans-serif;
    --script: "Aref Ruqaa", "Amiri", "Traditional Arabic", serif;
    color-scheme: dark;
  }

  html, body { height: 100%; }
  body {
    margin: 0;
    overflow: hidden;
    background:
      radial-gradient(ellipse 90% 55% at 50% 115%, var(--glow) 0%, transparent 70%),
      linear-gradient(180deg, var(--night) 0%, var(--night-2) 100%);
    background-color: var(--night);
    color: var(--cream);
    font-family: var(--body);
    -webkit-tap-highlight-color: transparent;
  }

  /* sky */
  .sky { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .star {
    position: absolute; border-radius: 50%; background: var(--cream);
    animation: twinkle var(--d, 3s) ease-in-out infinite alternate;
  }
  @keyframes twinkle { from { opacity: .15; } to { opacity: .9; } }
  .moon {
    position: absolute; top: max(28px, env(safe-area-inset-top, 0px)); left: max(28px, env(safe-area-inset-left, 0px));
    width: 54px; height: 54px; border-radius: 50%;
    box-shadow: -12px 8px 0 0 var(--candle);
    transform: rotate(-20deg);
    filter: drop-shadow(0 0 14px var(--candle));
    opacity: .9;
  }

  /* question screen */
  .ask {
    position: relative;
    height: 100%;
    display: grid;
    place-content: center;
    justify-items: center;
    gap: 1.1rem;
    text-align: center;
    padding-block: 24px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .name {
    margin: 0;
    font-family: var(--script);
    font-weight: 700;
    font-size: clamp(2.6rem, 11vw, 4.2rem);
    line-height: 1;
    color: var(--candle);
    text-shadow: 0 0 24px color-mix(in srgb, var(--candle) 45%, transparent);
  }
  .question {
    margin: 0;
    font-family: var(--display);
    font-weight: 400;
    font-size: clamp(2rem, 8.5vw, 3.6rem);
    line-height: 1.25;
    text-wrap: balance;
    max-width: 14ch;
  }
  .hint {
    margin: 0;
    min-height: 1.6em;
    font-size: clamp(1rem, 4vw, 1.2rem);
    color: var(--muted);
    transition: opacity .2s;
  }
  .no-wrap { min-height: 4.5rem; display: grid; place-items: center; }

  .btn-no {
    font: 700 1.35rem/1 var(--body);
    padding: .75em 2em .6em;
    border-radius: 999px;
    border: 2px solid var(--muted);
    background: transparent;
    color: var(--cream);
    cursor: pointer;
    touch-action: none;
    user-select: none;
  }
  .btn-no:focus-visible, .yes:focus-visible { outline: 3px solid var(--rose); outline-offset: 4px; }
  .btn-no.loose {
    position: fixed;
    z-index: 5;
    margin: 0;
    transition:
      left .38s cubic-bezier(.34, 1.56, .64, 1),
      top .38s cubic-bezier(.34, 1.56, .64, 1),
      transform .38s ease;
  }
  .btn-no.gone {
    top: 115vh !important;
    transform: rotate(220deg) scale(.8) !important;
    transition: top 1.1s cubic-bezier(.55, 0, .9, .45), transform 1.1s ease-in;
  }

  /* bear stage */
  .stage {
    position: fixed; inset: 0; z-index: 6;
    display: grid; place-items: center;
    pointer-events: none;
  }
  .rig { position: relative; width: 260px; height: 330px; }
  .rig.walking { animation: walk-in 2.8s cubic-bezier(.25, .7, .35, 1) forwards; }
  @keyframes walk-in {
    from { transform: translateX(calc(50vw + 220px)); }
    to   { transform: translateX(0); }
  }

  .bear-part {
    position: absolute; left: 30px; top: 40px;
    width: 200px; height: 240px;
    overflow: visible;
    transform-origin: 50% 100%;
    transition: transform .7s cubic-bezier(.34, 1.4, .64, 1);
  }
  .bear-body { z-index: 1; }
  .bear-arms { z-index: 3; }
  .rig.walking .bear-part,
  .rig.walking .yes { animation: bob .34s ease-in-out infinite alternate; }
  @keyframes bob {
    from { translate: 0 0; rotate: -2deg; }
    to   { translate: 0 -8px; rotate: 2deg; }
  }
  .rig.walking .foot-l { animation: step .34s ease-in-out infinite alternate; }
  .rig.walking .foot-r { animation: step .34s ease-in-out infinite alternate-reverse; }
  @keyframes step { from { transform: translateY(0); } to { transform: translateY(-7px); } }

  .arm {
    transform-box: view-box;
    transition: transform .55s cubic-bezier(.34, 1.56, .64, 1);
  }
  .arm-l { transform-origin: 58px 128px; transform: rotate(170deg); }
  .arm-r { transform-origin: 142px 128px; transform: rotate(-170deg); }

  .rig.point .bear-part { transform: translate(66px, 74px) scale(.86); }
  .rig.point .arm-l { transform: rotate(163deg); animation: wag .42s .55s ease-in-out infinite alternate; }
  .rig.point .arm-r { transform: rotate(-24deg); }
  @keyframes wag { from { transform: rotate(155deg); } to { transform: rotate(172deg); } }

  .yes {
    position: absolute; z-index: 2;
    top: 22px; left: 0; right: 0; margin-inline: auto; width: max-content;
    font: 400 1.9rem/1 var(--display);
    padding: .55em 1.5em .4em;
    border-radius: 999px;
    border: 3px solid var(--cream);
    background: var(--candle);
    color: var(--night);
    box-shadow: 0 6px 0 var(--candle-deep);
    cursor: pointer;
    pointer-events: auto;
    transition: top .6s cubic-bezier(.34, 1.56, .64, 1), scale .6s cubic-bezier(.34, 1.56, .64, 1);
  }
  .yes:active { translate: 0 4px; box-shadow: 0 2px 0 var(--candle-deep); }
  .rig.point .yes {
    top: 64px; scale: 1.12;
    animation: halo 1.3s .6s ease-out infinite;
  }
  @keyframes halo {
    0%   { box-shadow: 0 6px 0 var(--candle-deep), 0 0 0 0 color-mix(in srgb, var(--candle) 70%, transparent); }
    100% { box-shadow: 0 6px 0 var(--candle-deep), 0 0 0 26px transparent; }
  }

  .bubble {
    position: absolute; z-index: 4;
    top: 168px; left: -34px;
    max-width: 150px;
    padding: .55em .9em .4em;
    border-radius: 18px 18px 4px 18px;
    background: var(--cream);
    color: var(--ink);
    font: 700 1.05rem/1.35 var(--body);
    text-align: center;
    opacity: 0; scale: .4;
    transform-origin: 100% 100%;
    transition: opacity .3s .7s, scale .45s .7s cubic-bezier(.34, 1.56, .64, 1);
  }
  .rig.point .bubble { opacity: 1; scale: 1; }

  /* invitation */
  .invite {
    position: fixed; inset: 0; z-index: 8;
    overflow-y: auto;
    display: grid; place-items: center;
    padding-block: 32px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    background:
      radial-gradient(ellipse 80% 60% at 50% 40%, color-mix(in srgb, var(--rose) 22%, transparent), transparent 70%),
      var(--night);
  }
  .card {
    position: relative;
    width: min(100%, 26rem);
    background: var(--paper);
    color: var(--ink);
    border-radius: 22px;
    padding: 2rem 1.6rem 0;
    text-align: center;
    box-shadow: 0 24px 60px rgb(0 0 0 / .45);
    animation: card-in .8s cubic-bezier(.34, 1.4, .64, 1) both;
  }
  @keyframes card-in {
    from { transform: translateY(40px) rotate(-4deg) scale(.85); opacity: 0; }
    to   { transform: none; opacity: 1; }
  }
  .eyebrow {
    margin: 0;
    font: 700 .95rem/1 var(--body);
    letter-spacing: .04em;
    color: var(--rose-deep);
  }
  .card h2 {
    margin: .3rem 0 .6rem;
    font: 700 clamp(3rem, 14vw, 4.2rem)/1.1 var(--script);
    color: var(--ink);
  }
  .letter {
    margin: 0 auto .8rem;
    max-width: 30ch;
    font: 400 1.4rem/1.75 var(--script);
    text-wrap: pretty;
  }
  .letter.ask-line { color: var(--rose-deep); font-weight: 700; }
  .stub {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    margin: 1.4rem -1.6rem 0;
    padding: 1.1rem .6rem 1.3rem;
    border-top: 2px dashed color-mix(in srgb, var(--ink-soft) 55%, transparent);
    position: relative;
  }
  .stub::before, .stub::after {
    content: ""; position: absolute; top: -13px;
    width: 24px; height: 24px; border-radius: 50%;
    background: var(--night);
  }
  .stub::before { right: -12px; }
  .stub::after { left: -12px; }
  .stub div { display: grid; gap: .25rem; min-width: 0; }
  .stub div + div { border-right: 1px solid color-mix(in srgb, var(--ink-soft) 30%, transparent); }
  .stub span { font: 500 .85rem/1 var(--body); color: var(--ink-soft); }
  .stub b { font: 400 1.35rem/1.1 var(--display); color: var(--ink); }
  .sign {
    margin: 0; padding: 0 0 1.4rem;
    font: 700 1.3rem/1 var(--script);
    color: var(--rose-deep);
  }

  .hearts { position: fixed; inset: 0; pointer-events: none; z-index: 9; overflow: hidden; }
  .heart {
    position: absolute; bottom: -40px;
    animation: rise var(--dur) var(--delay) cubic-bezier(.2, .6, .4, 1) forwards;
    opacity: 0;
  }
  @keyframes rise {
    0%   { transform: translate(0, 0) rotate(0); opacity: 0; }
    10%  { opacity: 1; }
    100% { transform: translate(var(--dx), -115vh) rotate(var(--rot)); opacity: 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    .star, .rig.walking, .rig.walking .bear-part, .rig.walking .yes,
    .rig.point .arm-l, .rig.point .yes, .card { animation: none !important; }
    .heart { display: none; }
  }
</style>
</head>
<body>

<div class="sky" id="sky" aria-hidden="true"><div class="moon"></div></div>

<main class="ask" id="ask" dir="rtl">
  <p class="name">جيسي</p>
  <h1 class="question">إيه رأيك نخرج النهارده سوا؟</h1>
  <p class="hint" id="hint" aria-live="polite">في زرار واحد بس... اختاري بحكمة</p>
  <div class="no-wrap">
    <button class="btn-no" id="no" type="button">لأ</button>
  </div>
</main>

<div class="stage" id="stage" hidden>
  <div class="rig" id="rig">
    <svg class="bear-part bear-body" viewBox="0 0 200 240" aria-hidden="true">
      <circle cx="62" cy="34" r="20" fill="var(--bear)"/>
      <circle cx="62" cy="34" r="10" fill="var(--bear-light)"/>
      <circle cx="138" cy="34" r="20" fill="var(--bear)"/>
      <circle cx="138" cy="34" r="10" fill="var(--bear-light)"/>
      <ellipse cx="100" cy="170" rx="52" ry="54" fill="var(--bear)"/>
      <ellipse cx="100" cy="180" rx="33" ry="34" fill="var(--bear-light)"/>
      <g class="foot-l">
        <ellipse cx="74" cy="224" rx="21" ry="12" fill="var(--bear)"/>
        <ellipse cx="74" cy="225" rx="10" ry="6" fill="var(--bear-light)"/>
      </g>
      <g class="foot-r">
        <ellipse cx="126" cy="224" rx="21" ry="12" fill="var(--bear)"/>
        <ellipse cx="126" cy="225" rx="10" ry="6" fill="var(--bear-light)"/>
      </g>
      <circle cx="100" cy="72" r="46" fill="var(--bear)"/>
      <ellipse cx="100" cy="90" rx="22" ry="16" fill="var(--bear-light)"/>
      <ellipse cx="100" cy="82" rx="8" ry="5.5" fill="var(--bear-dark)"/>
      <path d="M90 94 Q100 105 110 94" fill="none" stroke="var(--bear-dark)" stroke-width="3" stroke-linecap="round"/>
      <circle cx="82" cy="66" r="5.5" fill="var(--bear-dark)"/>
      <circle cx="118" cy="66" r="5.5" fill="var(--bear-dark)"/>
      <circle cx="84" cy="64" r="1.8" fill="var(--cream)"/>
      <circle cx="120" cy="64" r="1.8" fill="var(--cream)"/>
      <circle cx="73" cy="84" r="7" fill="var(--rose)" opacity=".55"/>
      <circle cx="127" cy="84" r="7" fill="var(--rose)" opacity=".55"/>
      <path d="M100 122 L82 111 L82 133 Z" fill="var(--rose)"/>
      <path d="M100 122 L118 111 L118 133 Z" fill="var(--rose)"/>
      <circle cx="100" cy="122" r="5" fill="var(--rose-deep)"/>
    </svg>

    <button class="yes" id="yes" type="button">أيوه 💛</button>

    <svg class="bear-part bear-arms" viewBox="0 0 200 240" aria-hidden="true">
      <g class="arm arm-l">
        <rect x="46" y="124" width="24" height="78" rx="12" fill="var(--bear)"/>
        <circle cx="58" cy="200" r="13" fill="var(--bear)"/>
        <circle cx="58" cy="202" r="6" fill="var(--bear-light)"/>
      </g>
      <g class="arm arm-r">
        <rect x="130" y="124" width="24" height="78" rx="12" fill="var(--bear)"/>
        <circle cx="142" cy="200" r="13" fill="var(--bear)"/>
        <circle cx="142" cy="202" r="6" fill="var(--bear-light)"/>
      </g>
    </svg>

    <p class="bubble" dir="rtl">اضغطي هنا يا جيسي!<br>يلا بقى 👆</p>
  </div>
</div>

<section class="invite" id="invite" dir="rtl" hidden>
  <article class="card">
    <p class="eyebrow">دعوة خاصة جدًا</p>
    <h2>جيسي</h2>
    <p class="letter">زوجك العزيز يدعوكِ لقضاء وقت لطيف في مكان حلو زيك، في تمام الساعة ٩ مساءً.</p>
    <p class="letter ask-line">أرجو أن تقبلي هذا الموعد مني.</p>
    <div class="stub">
      <div><span>الميعاد</span><b>٩:٠٠ م</b></div>
      <div><span>الحجز</span><b>لشخصين</b></div>
      <div><span>اليوم</span><b>النهارده</b></div>
    </div>
    <p class="sign">— زوجك 💛</p>
  </article>
</section>

<div class="hearts" id="hearts" aria-hidden="true"></div>

<script>
  const $ = (id) => document.getElementById(id);
  const no = $('no'), hint = $('hint'), stage = $('stage'), rig = $('rig'), yes = $('yes');
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // stars
  const sky = $('sky');
  for (let i = 0; i < 55; i++) {
    const s = document.createElement('span');
    const size = Math.random() * 2.4 + 1;
    s.className = 'star';
    s.style.cssText = `left:${Math.random() * 100}%;top:${Math.random() * 85}%;width:${size}px;height:${size}px;--d:${(Math.random() * 3 + 1.5).toFixed(2)}s;animation-delay:${(Math.random() * 3).toFixed(2)}s`;
    sky.appendChild(s);
  }

  const lines = [
    'إيه ده؟ الزرار هرب!',
    'مش هتعرفي تمسكيه على فكرة',
    'الزرار ده بيتكسف منك',
    'هو أصلاً مش موافق إنك تدوسي عليه',
    'استني... في حد جاي يساعدنا 👀',
  ];
  const MAX_ESCAPES = 5;
  let escapes = 0, lastFlee = 0, finished = false;

  function flee(e) {
    if (finished) return;
    if (e) e.preventDefault();
    const now = performance.now();
    if (now - lastFlee < 350) return; // pointerdown + click fire together on touch
    lastFlee = now;

    const r = no.getBoundingClientRect();
    if (!no.classList.contains('loose')) {
      no.style.left = r.left + 'px';
      no.style.top = r.top + 'px';
      no.classList.add('loose');
      no.offsetWidth; // commit start position so the first jump animates
    }

    const pad = 16, W = innerWidth, H = innerHeight;
    let x, y, tries = 0;
    do {
      x = pad + Math.random() * Math.max(0, W - r.width - pad * 2);
      y = pad + Math.random() * Math.max(0, H - r.height - pad * 2);
    } while (Math.hypot(x - r.left, y - r.top) < Math.min(W, H) * 0.35 && ++tries < 40);

    no.style.left = x + 'px';
    no.style.top = y + 'px';
    no.style.transform = `rotate(${(Math.random() * 40 - 20).toFixed(0)}deg)`;

    hint.textContent = lines[escapes];
    escapes++;
    if (escapes >= MAX_ESCAPES) {
      finished = true;
      setTimeout(callTheBear, 700);
    }
  }

  no.addEventListener('pointerenter', (e) => { if (e.pointerType === 'mouse') flee(e); });
  no.addEventListener('pointerdown', flee);
  no.addEventListener('click', flee);

  function callTheBear() {
    no.classList.add('gone');
    no.disabled = true;
    stage.hidden = false;
    if (reduceMotion) { rig.classList.add('point'); return; }
    rig.classList.add('walking');
    rig.addEventListener('animationend', function onArrive(e) {
      if (e.target !== rig) return;
      rig.removeEventListener('animationend', onArrive);
      rig.classList.remove('walking');
      rig.classList.add('point');
    });
  }

  yes.addEventListener('click', () => {
    $('ask').hidden = true;
    stage.hidden = true;
    $('invite').hidden = false;
    burstHearts();
  });

  function burstHearts() {
    if (reduceMotion) return;
    const box = $('hearts');
    const colors = ['var(--rose)', 'var(--candle)', 'var(--rose-deep)', 'var(--cream)'];
    for (let i = 0; i < 42; i++) {
      const h = document.createElement('span');
      h.className = 'heart';
      h.textContent = '♥';
      h.style.cssText = `left:${Math.random() * 100}%;font-size:${(Math.random() * 1.6 + 1).toFixed(2)}rem;color:${colors[i % colors.length]};--dur:${(Math.random() * 2 + 2.6).toFixed(2)}s;--delay:${(Math.random() * 1.2).toFixed(2)}s;--dx:${(Math.random() * 160 - 80).toFixed(0)}px;--rot:${(Math.random() * 120 - 60).toFixed(0)}deg`;
      box.appendChild(h);
    }
  }
</script>
</body>
</html>
